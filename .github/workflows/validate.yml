name: Validate skill

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify complete skill, upstream hashes, links and manifest
        run: python scripts/package.py --check
      - name: Check renderer syntax
        run: node --check scripts/video.mjs
      - name: Verify locked runtime dependencies
        run: npm --prefix assets/runtime ci --ignore-scripts
